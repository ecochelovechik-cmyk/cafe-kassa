<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Центр плова — Касса</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Касса">
<meta name="format-detection" content="telephone=no">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827;-webkit-text-size-adjust:100%;
 /* iPhone/Android воспринимали быстрые повторные нажатия как двойной тап и увеличивали
    страницу. manipulation убирает только двойной тап, щипок для увеличения остаётся. */
 touch-action:manipulation}
/* при быстрых нажатиях по блюду не выделять текст и не звать лупу.
   touch-action не наследуется, поэтому дублируем его на сами кнопки. */
.card.item,.card.item *,button,.cnt,.minus{-webkit-user-select:none;user-select:none;
 -webkit-touch-callout:none;touch-action:manipulation}
header{background:#111827;color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}
.wrap{max-width:1100px;margin:auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;cursor:pointer;background:#e5e7eb;font-family:inherit}
button:active{opacity:.7}
button.primary{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.dark{background:#374151;color:white}
.blue{background:#2563eb;color:white}
nav button.active{background:#374151;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{background:white;border-radius:14px;padding:14px;box-shadow:0 1px 5px #0001;text-align:left}
.card b{display:block;margin-bottom:8px}
.price{color:#15803d;font-weight:bold}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.table{background:white;padding:20px;border-radius:14px;text-align:center;border:2px solid #e5e7eb}
.open{border-color:#f59e0b;background:#fffbeb}
.small{font-size:13px;color:#6b7280}
.panel{background:white;border-radius:14px;padding:16px;margin-top:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:9px 0}
.row:last-child{border-bottom:0}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 10px;font-size:15px;font-family:inherit}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.hidden{display:none}
.stat{font-size:25px;font-weight:bold}
.muted{color:#6b7280}
.ph{width:100%;height:76px;object-fit:cover;border-radius:9px;margin-bottom:8px;display:block;background:#e5e7eb}
.mph{width:60px;height:60px;object-fit:cover;border-radius:10px;background:#e5e7eb;flex:0 0 auto}
.noph{width:60px;height:60px;border-radius:10px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
.mrow{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
.mrow:last-child{border-bottom:0}
.mrow .txt{flex:1;min-width:0}
.card.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.card.tap:active{background:#f3f4f6}
.card.item{position:relative;cursor:pointer;padding-right:46px;min-height:78px;-webkit-tap-highlight-color:transparent}
.card.item:active{background:#f3f4f6}
.card.has{border:2px solid #16a34a;background:#f0fdf4;padding:12px 44px 12px 12px}
.cnt{cursor:pointer;position:absolute;top:9px;right:9px;background:#16a34a;color:#fff;border-radius:999px;min-width:30px;height:30px;line-height:30px;text-align:center;font-weight:bold;font-size:15px;padding:0 8px}
.minus{position:absolute;bottom:8px;right:8px;background:#e5e7eb;border-radius:9px;width:36px;height:32px;line-height:32px;text-align:center;font-weight:bold;font-size:20px;color:#374151}
.minus:active{background:#d1d5db}
#bar{position:fixed;left:0;right:0;bottom:0;background:#111827;color:#fff;padding:11px 16px calc(11px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:10;box-shadow:0 -2px 12px #0003}
#bar.hidden{display:none}
/* Своя цифровая панель для порций. Системная клавиатура на телефоне
   закрывает пол-экрана и открывается с задержкой. */
.ovl{position:fixed;inset:0;background:#00000099;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.ovl.hidden{display:none}
.pad{background:#fff;width:100%;max-width:430px;border-radius:20px 20px 0 0;
 padding:16px 14px calc(14px + env(safe-area-inset-bottom))}
.pad .pt{font-size:15px;color:#6b7280;text-align:center}
.pad .pn{font-size:19px;font-weight:700;text-align:center;margin-top:2px}
.pad .pv{font-size:40px;font-weight:800;text-align:center;padding:8px;margin-top:10px;
 border:2px solid #e5e7eb;border-radius:14px;letter-spacing:1px}
.pad .ph{font-size:13px;color:#6b7280;text-align:center;margin-top:6px}
.pad .quick{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:11px}
.pad .quick button{padding:15px 0;font-size:17px;font-weight:700;background:#dcfce7;color:#166534}
.pad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.pad .keys button{padding:17px 0;font-size:24px;font-weight:600;background:#f3f4f6}
.pad .acts{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-top:11px}
.pad .acts button{padding:15px 0;font-size:16px}
#bar .s{font-size:13px;color:#9ca3af}
#bar .m{font-size:20px;font-weight:bold}
#bar button{padding:12px 16px}
.pad{height:calc(40px + env(safe-area-inset-bottom))}
.bar-wrap{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar-fill{height:100%;border-radius:99px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:bold;white-space:nowrap}
.b-hall{background:#dcfce7;color:#166534}
.b-street{background:#fef3c7;color:#92400e}
.b-deliv{background:#dbeafe;color:#1e40af}
.b-void{background:#fee2e2;color:#991b1b}
.sect{margin:22px 0 10px;font-size:18px;font-weight:bold;color:#374151;display:flex;align-items:baseline;gap:10px;border-bottom:2px solid #d1d5db;padding-bottom:7px}
.sect.first{margin-top:0}
.sect .small{font-weight:normal}
.tables.street .table{background:#fefce8;border-color:#e5e7eb}
.tables.street .table.open{background:#fffbeb;border-color:#f59e0b}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.cats button{padding:8px 12px;font-size:14px}
.cats button.on{background:#111827;color:white}
.note{font-size:13px;color:#1e40af;background:#dbeafe;border-radius:7px;padding:2px 8px;display:inline-block;margin-top:3px}
.qty{min-width:40px;text-align:center;font-weight:bold;background:#fff;border:1px solid #d1d5db}
.warn{background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.tot{font-size:22px;margin:12px 0}
.sub{display:flex;justify-content:space-between;padding:4px 0;color:#6b7280;font-size:14px}
label{font-size:14px;font-weight:bold;display:block;margin-top:8px}
#receipt{display:none}
@media print{
 body>*{display:none!important}
 #receipt{display:block!important;font-family:"Courier New",monospace;font-size:13px;width:72mm;margin:0;color:#000}
 #receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}
 #receipt .c{text-align:center}
 #receipt .r{display:flex;justify-content:space-between}
 #receipt .big{font-size:16px;font-weight:bold}
 @page{margin:3mm}
}
</style>
</head>
<body>
<header><h1>🍚 Центр плова — Касса</h1><span id="clock"></span></header>
<div class="wrap">
<nav>
<button id="nav-tables" onclick="show('tables')">🪑 Столы</button>
<button id="nav-delivery" onclick="show('delivery')">🚚 Доставка</button>
<button id="nav-cash" onclick="show('cash')">💰 Касса</button>
<button id="nav-history" onclick="show('history')">📋 История</button>
<button id="nav-reports" onclick="show('reports')">📊 Отчёты</button>
<button id="nav-menu" onclick="show('menu')">🍽️ Меню</button>
<button id="nav-settings" onclick="show('settings')">⚙️ Данные</button>
</nav>
<div id="filewarn" class="hidden"></div>
<section id="tables"></section>
<section id="delivery" class="hidden"></section>
<section id="cash" class="hidden"></section>
<section id="history" class="hidden"></section>
<section id="reports" class="hidden"></section>
<section id="menu" class="hidden"></section>
<section id="settings" class="hidden"></section>
</div>
<div id="bar" class="hidden"></div>
<div id="pad" class="ovl hidden" onclick="if(event.target===this)padClose()"></div>
<div id="receipt"></div>
<script>
const APP_VERSION='2026-08-27.3';
// фото, поставляемые вместе с приложением: обновляются у всех при выходе новой версии
// и не занимают память устройства. Своё фото, снятое на телефон, всегда важнее.
const STOCK_PHOTOS={
 'Плов':'./dishes/plov.jpg',
 'Казан-кебаб':'./dishes/kazan.jpg',
 'Манты':'./dishes/manti.jpg',
 'Котлета с жареным картофелем':'./dishes/kotleta.jpg',
 'Чахохбили':'./dishes/chahohbili.jpg',
 'Шурпа':'./dishes/shurpa.jpg',
 'Мастава':'./dishes/mastava.jpg',
 'Чечевичный суп':'./dishes/lentil.jpg',
 'Свежий салат':'./dishes/salat.jpg',
 'Оливье':'./dishes/olivie.jpg',
 'Лепёшка':'./dishes/lepeshka.jpg',
 'Чай с лимоном':'./dishes/tea.jpg',
 'Кефир':'./dishes/kefir.jpg',
 'Вода без газа':'./dishes/water.jpg',
 'Курутоб':'./dishes/kurutob.jpg',
 'Курутоби гушти':'./dishes/kurutob-meat.jpg'
};
function dishPhoto(m){return (m&&m.img)||(m&&STOCK_PHOTOS[m.n])||''}
const KEY='pilaf_pos_v1';
const PAYS=['Наличные','Карта'];
// Способы оплаты, которые нужно показывать в отчётах: те, что предлагаются сейчас,
// плюс встречающиеся в старых чеках и операциях (WeChat Pay, Alipay).
// Иначе выручка прошлых месяцев пропала бы из разбивок и из сверки кассы.
function allPays(){
 let r=PAYS.slice();
 [...(db.orders||[]),...(db.cash||[])].forEach(o=>{if(o.pay&&r.indexOf(o.pay)<0)r.push(o.pay)});
 return r;
}
const DEFAULT_MENU=[
 ['Плов',40,'Основные'],['Казан-кебаб',45,'Основные'],['Манты',30,'Основные'],
 ['Котлета с жареным картофелем',30,'Основные'],['Чахохбили',30,'Основные'],
 ['Шурпа',30,'Супы'],['Мастава',30,'Супы'],['Чечевичный суп',30,'Супы'],
 ['Свежий салат',10,'Салаты'],['Оливье',15,'Салаты'],['Лепёшка',5,'Выпечка'],
 ['Кола 0.33',5,'Напитки'],['Пепси',5,'Напитки'],['Фанта',5,'Напитки'],
 ['Спрайт',5,'Напитки'],['Чай с лимоном',10,'Напитки'],['Кефир',8,'Напитки'],
 ['Вода без газа',2,'Напитки'],['Дайао',7,'Напитки'],
 ['Курутоб',30,'Основные'],['Курутоби гушти',45,'Основные']
].map(m=>({n:m[0],p:m[1],c:m[2],img:m[3]||''}));

// суммы намеренно не зашиты в код — заполняются на устройстве, вкладка «Касса → Постоянные»
const DEFAULT_FIXED=[
 {n:'Аренда',s:0,pay:'Наличные'},
 {n:'Зарплата',s:0,pay:'Наличные'},
 {n:'Свет',s:0,pay:'Наличные'},
 {n:'Налог',s:0,pay:'Наличные'},
 {n:'Интернет',s:0,pay:'Наличные'}
];
let storageOk=(function(){
 try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}
})();
let db=load();
let histFilter='all';

function load(){
 let d=null;
 try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){d=null}
 if(!d)return{v:2,settings:{hall:6,street:7,footer:'Спасибо за визит! 谢谢惠顾!'},counter:1,menu:DEFAULT_MENU.slice(),orders:[],open:{},delivery:{},shifts:[],shiftStart:null,cash:[],waste:[],fixed:DEFAULT_FIXED.map(f=>({n:f.n,s:f.s,pay:f.pay})),fixedSkip:[],lastBackup:0};
 // миграция со старой версии (меню было массивом [название, цена])
 if(!d.v){
  d.menu=(d.menu||[]).map(m=>Array.isArray(m)?{n:m[0],p:+m[1],c:'Прочее'}:m);
  d.settings={hall:6,street:7,footer:'Спасибо за визит! 谢谢惠顾!'};
  d.counter=(d.orders||[]).length+1;d.lastBackup=0;d.v=2;
 }
 d.settings=d.settings||{hall:6,street:7,footer:''};
 d.orders=d.orders||[];d.open=d.open||{};d.delivery=d.delivery||{};d.menu=d.menu||[];d.shifts=d.shifts||[];d.cash=d.cash||[];d.waste=d.waste||[];if(!d.fixed)d.fixed=DEFAULT_FIXED.map(f=>({n:f.n,s:f.s,pay:f.pay}));d.fixedSkip=d.fixedSkip||[];
 return d;
}
function save(){
 if(!storageOk)return;
 try{localStorage.setItem(KEY,JSON.stringify(db));if(typeof checkQuota==='function')checkQuota()}
 catch(e){storageOk=false;alert('⚠️ Не удалось сохранить заказ — память браузера переполнена или недоступна.\n\nСрочно сделайте бэкап: «⚙️ Данные» → «Сохранить копию в файл».')}
}
function money(n){return Number(n||0).toFixed(2)+' ¥'}
// количество может быть дробным: половина порции — обычное дело
function qtyText(q){q=+q||0;return Number.isInteger(q)?String(q):q.toFixed(1)}
function roundQty(q){return Math.max(0,Math.round((+q||0)*2)/2)}
function tables(){return (+db.settings.hall||0)+(+db.settings.street||0)}
function tableName(i){
 i=+i;
 let hall=+db.settings.hall||0;
 return i>hall?'Улица '+(i-hall):'Стол '+i;
}
// имя из закрытого заказа: сохранённое в чеке имеет приоритет — настройки зала могли поменяться
function orderName(o){return o.type==='table'?(o.label||tableName(o.id)):'Доставка'}
function hideBar(){
 document.getElementById('bar').classList.add('hidden');
 document.querySelector('.wrap').style.paddingBottom='';
}
// подстраховка: любой экран, на котором панель всё же видна, получает место под неё
function fixPad(){setTimeout(padUnderBar,0)}
// панель закреплена внизу и перекрывала бы кнопки заказа — освобождаем под неё место с запасом
function padUnderBar(){
 let bar=document.getElementById('bar');
 let w=document.querySelector('.wrap');
 if(bar.classList.contains('hidden')){w.style.paddingBottom='';return}
 w.style.paddingBottom=(bar.offsetHeight+56)+'px';
}
function setSection(id){
 hideBar();
 for(const x of ['tables','delivery','cash','history','reports','menu','settings']){
  document.getElementById(x).classList.toggle('hidden',x!==id);
  document.getElementById('nav-'+x).classList.toggle('active',x===id);
 }
}
function show(id){
 document.getElementById('bar').classList.add('hidden');
 setSection(id);
 ({tables:renderTables,delivery:renderDelivery,cash:renderCash,history:renderHistory,reports:renderReports,menu:renderMenu,settings:renderSettings})[id]();
 padUnderBar();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- СТОЛЫ ---------- */
function tableCard(i){
 let o=db.open[i],sum=total(o);
 return `<button class="table ${o?'open':''}" onclick="openTable(${i})"><b>${tableName(i)}</b>${o?`<div class="price">${money(sum)}</div><div class="small">${o.items.length} поз. · ${since(o.started)}</div>`:'<div class="small">Свободен</div>'}</button>`;
}
function renderTables(){
 hideBar();
 let hall=+db.settings.hall||0,street=+db.settings.street||0,h=backupWarning();
 if(hall){
  let busy=0;for(let i=1;i<=hall;i++)if(db.open[i])busy++;
  h+=`<div class="sect first">🏠 Зал <span class="small">${busy?busy+' из '+hall+' занято':hall+' столов, все свободны'}</span></div><div class="tables">`;
  for(let i=1;i<=hall;i++)h+=tableCard(i);
  h+='</div>';
 }
 if(street){
  let busy=0;for(let i=hall+1;i<=hall+street;i++)if(db.open[i])busy++;
  h+=`<div class="sect">☀️ Улица <span class="small">${busy?busy+' из '+street+' занято':street+' столов, все свободны'}</span></div><div class="tables street">`;
  for(let i=hall+1;i<=hall+street;i++)h+=tableCard(i);
  h+='</div>';
 }
 // заказы на столах, которых уже нет в настройках — иначе деньги пропали бы с экрана
 let lost=Object.keys(db.open).filter(k=>{let i=+k;return !(i>=1&&i<=hall+street)});
 if(lost.length){
  h+='<div class="sect">⚠️ Заказы на убранных столах</div><div class="warn">Этих столов больше нет в настройках, но заказы по ним открыты. Рассчитайте гостей или перенесите заказ на существующий стол.</div><div class="tables">';
  lost.forEach(k=>{
   let o=db.open[k];
   h+=`<button class="table open" onclick="openTable(${+k})"><b>Стол ${esc(k)}</b><div class="price">${money(total(o))}</div><div class="small">${o.items.length} поз.</div></button>`;
  });
  h+='</div>';
 }
 if(!hall&&!street)h+='<div class="panel"><p class="muted">Столы не настроены. Зайдите в «⚙️ Данные» и укажите, сколько столов в зале и на улице.</p></div>';
 let busy=Object.keys(db.open).length,openSum=Object.values(db.open).reduce((s,o)=>s+total(o),0);
 if(busy)h+=`<div class="panel"><div class="row"><span>Занято столов: <b>${busy}</b></span><span>Открытых заказов на <b class="price">${money(openSum)}</b></span></div></div>`;
 document.getElementById('tables').innerHTML=h;
}
function since(t){
 if(!t)return'';
 let m=Math.floor((Date.now()-new Date(t))/60000);
 return m<60?m+' мин':Math.floor(m/60)+' ч '+(m%60)+' мин';
}
function openTable(n){
 let o=db.open[n]||{items:[],started:new Date().toISOString()};
 db.open[n]=o;save();orderScreen('table',n);
}

/* ---------- ЭКРАН ЗАКАЗА ---------- */
function getOrder(type,id){return type==='table'?db.open[id]:db.delivery[id]}
function orderScreen(type,id){
 let o=getOrder(type,id);if(!o)return show(type==='table'?'tables':'delivery');
 setSection(type==='table'?'tables':'delivery');
 let title=type==='table'?tableName(id):'Доставка '+id;
 let h=`<div class="panel"><h2>${esc(title)} <span class="small">${since(o.started)}</span></h2><div class="grid">`;
 db.menu.forEach((m,i)=>{
  let q=qtyOf(o,m.n), ph=dishPhoto(m);
  h+=`<div class="card item ${q?'has':''}" onclick="addItem('${type}','${id}',${i})">`+
     (ph?`<img class="ph" src="${ph}" alt="" loading="lazy" onerror="this.remove()">`:'')+
     (q?`<span class="cnt" onclick="event.stopPropagation();setQtyByDish('${type}','${id}',${i})">${qtyText(q)}</span>`:'')+
     `<b>${esc(m.n)}</b><span class="price">${money(m.p)}</span>`+
     (q?`<span class="minus" onclick="event.stopPropagation();decByName('${type}','${id}',${i})">−</span>`:'')+
     '</div>';
 });
 h+='</div><p class="small muted">Нажмите на зелёный кружок с количеством, чтобы поставить 0.5 или 1.5 порции.</p><hr><h3>Заказ</h3>';
 if(!o.items.length)h+='<p class="muted">Пока ничего не добавлено.</p>';
 else h+='<p class="small muted">Нажмите на количество, чтобы поставить половину или полторы порции.</p>';
 o.items.forEach((x,i)=>h+=`<div class="row"><span>${esc(x.name)}<br><span class="small">${money(x.price)} × ${qtyText(x.qty)}</span>${x.note?`<br><span class="note">💬 ${esc(x.note)}</span>`:''}</span><b>${money(x.price*x.qty)}</b><span class="actions"><button class="${x.note?'blue':''}" onclick="setNote('${type}','${id}',${i})">💬</button><button onclick="changeItem('${type}','${id}',${i},-1)">−</button><button class="qty" onclick="setQty('${type}','${id}',${i})">${qtyText(x.qty)}</button><button onclick="changeItem('${type}','${id}',${i},1)">+</button><button class="danger" onclick="delItem('${type}','${id}',${i})">✕</button></span></div>`);
 let sub=total(o),disc=+o.discount||0,fin=Math.max(0,sub-disc);
 if(o.items.length){
  h+=`<div class="sub"><span>Сумма</span><span>${money(sub)}</span></div>`;
  if(disc)h+=`<div class="sub"><span>Скидка</span><span>−${money(disc)}</span></div>`;
  h+=`<div class="tot"><b>Итого: ${money(fin)}</b></div>`;
  if(type==='delivery'&&+o.courier)h+=`<div class="sub"><span>🚴 Курьеру <span class="small">расход кафе, гость не платит</span></span><span>−${money(o.courier)}</span></div><div class="sub"><span><b>Кафе получит чистыми</b></span><span><b>${money(Math.max(0,fin-o.courier))}</b></span></div>`;
 }
 h+='<div class="actions">'+
  `<button onclick="show('${type==='table'?'tables':'delivery'}')">← Назад</button>`;
 if(o.items.length){
  h+=`<button class="blue" onclick="printBill('${type}','${id}')">🖨 Пречек</button>`+
     `<button onclick="setDiscount('${type}','${id}')">% Скидка</button>`;
  if(type==='table')h+=`<button onclick="moveTable(${id})">↔ Перенести</button>`;
  else h+=`<button class="${(+o.courier)?'blue':''}" onclick="setCourier('${id}')">🚴 Курьеру${(+o.courier)?': '+money(o.courier):''}</button>`;
  h+=`<button class="primary" onclick="payScreen('${type}','${id}')">✓ Оплата и закрытие</button>`;
 }
 h+=`<button class="danger" onclick="cancelOrder('${type}','${id}')">Отменить заказ</button></div></div>`;
 h+='<div class="pad"></div>';
 document.getElementById(type==='table'?'tables':'delivery').innerHTML=h;
 renderBar(type,id);
}
// закреплённый итог внизу: сумму видно, не прокручивая экран
function renderBar(type,id){
 let bar=document.getElementById('bar');
 let sec=type==='table'?'tables':'delivery';
 let o=getOrder(type,id);            // перечитываем из базы, а не верим переданному объекту
 if(document.getElementById(sec).classList.contains('hidden')||!o||!o.items||!o.items.length){
  bar.classList.add('hidden');
  document.querySelector('.wrap').style.paddingBottom='';
  return;
 }
 let n=o.items.reduce((s,x)=>s+x.qty,0),fin=Math.max(0,total(o)-(+o.discount||0));
 bar.innerHTML=`<span><span class="s">${esc(type==='table'?tableName(id):'Доставка')} · ${n} шт.</span><br><span class="m">${money(fin)}</span></span>`+
  `<span class="actions"><button class="dark" onclick="show('${sec}')">${type==='table'?'🪑 Столы':'🚚 Доставки'}</button>`+
  `<button class="primary" onclick="payScreen('${type}','${id}')">✓ Оплата</button></span>`;
 bar.classList.remove('hidden');
 padUnderBar();
}
// сколько этого блюда уже в заказе (складываем, даже если цена в меню менялась)
function qtyOf(o,name){return (o&&o.items||[]).filter(x=>x.name===name).reduce((s,x)=>s+x.qty,0)}
function decByName(type,id,mi){
 let o=getOrder(type,id),name=db.menu[mi].n;
 for(let i=o.items.length-1;i>=0;i--){
  if(o.items[i].name!==name)continue;
  if(--o.items[i].qty<=0)o.items.splice(i,1);
  break;
 }
 save();orderScreen(type,id);
}
function addItem(type,id,mi){
 let o=getOrder(type,id),m=db.menu[mi];
 let x=o.items.find(x=>x.name===m.n&&x.price===+m.p&&!x.note);
 x?x.qty++:o.items.push({name:m.n,price:+m.p,cost:+m.k||0,qty:1});
 save();orderScreen(type,id);
}
// то же самое, но прямо с карточки блюда — по названию находим позицию в заказе
function setQtyByDish(type,id,mi){
 let o=getOrder(type,id),name=db.menu[mi].n;
 let i=o.items.findIndex(x=>x.name===name);
 if(i<0)return;
 setQty(type,id,i);
}
/* ---------- СВОЯ ЦИФРОВАЯ ПАНЕЛЬ ---------- */
// Только цифры и запятая. Частые значения вынесены наверх: одно нажатие — и готово.
let padState=null;
function qtyPad(name,cur,onOk,onRemove){
 padState={name,v:qtyText(cur).replace('.',','),fresh:true,onOk,onRemove};
 renderPad();
 document.getElementById('pad').classList.remove('hidden');
}
function renderPad(){
 if(!padState)return;
 let q=[0.5,1,1.5,2,3].map(v=>`<button onclick="padQuick(${v})">${qtyText(v).replace('.',',')}</button>`).join('');
 let keys=['7','8','9','4','5','6','1','2','3',',','0','del']
  .map(k=>`<button onclick="padKey('${k}')">${k==='del'?'⌫':k}</button>`).join('');
 document.getElementById('pad').innerHTML=
  `<div class="pad" onclick="event.stopPropagation()">`+
  `<div class="pt">Сколько порций</div><div class="pn">${esc(padState.name)}</div>`+
  `<div class="pv">${esc(padState.v||'0')}</div>`+
  `<div class="ph">Порция считается по половинкам: 0,5 · 1 · 1,5</div>`+
  `<div class="quick">${q}</div><div class="keys">${keys}</div>`+
  `<div class="acts"><button class="danger" onclick="padRemove()">Убрать</button>`+
  `<button onclick="padClose()">Отмена</button>`+
  `<button class="primary" onclick="padOk()">Готово</button></div></div>`;
}
function padClose(){document.getElementById('pad').classList.add('hidden');padState=null}
function padKey(k){
 if(!padState)return;
 let v=padState.fresh?'':padState.v;
 padState.fresh=false;
 if(k==='del')v=v.slice(0,-1);
 else if(k===','){if(v.indexOf(',')<0)v=(v||'0')+','}
 else{
  let c=v.indexOf(',');
  if(c>=0&&v.length-c>1)return;            // шаг — половина, вторая цифра после запятой не нужна
  if(c<0&&v.length>=3)return;              // 999 порций хватит любому столу
  v=(v==='0')?k:v+k;
 }
 padState.v=v;renderPad();
}
function padQuick(v){if(padState){padState.v=String(v).replace('.',',');padOk()}}
function padOk(){
 if(!padState)return;
 let f=padState.onOk,q=roundQty(String(padState.v).replace(',','.'));
 padClose();f(q);
}
function padRemove(){if(!padState)return;let f=padState.onRemove;padClose();f()}
// нажатие на количество: можно поставить 1.5 порции, а не только целые
function setQty(type,id,i){
 let o=getOrder(type,id),x=o.items[i];
 let drop=function(){
  if(confirm('Убрать «'+x.name+'» из заказа?')){o.items.splice(i,1);save();orderScreen(type,id)}
 };
 qtyPad(x.name,x.qty,function(q){
  if(!(q>0))return drop();
  x.qty=q;save();orderScreen(type,id);
 },drop);
}
function changeItem(type,id,i,d){
 let o=getOrder(type,id),x=o.items[i];
 // у дробной позиции шаг тоже дробный, иначе 1.5 не убавить до 0.5
 let step=Number.isInteger(x.qty)?1:0.5;
 x.qty=roundQty(x.qty+d*step);
 if(x.qty<=0)o.items.splice(i,1);
 save();orderScreen(type,id);
}
function delItem(type,id,i){
 let o=getOrder(type,id);
 if(!confirm('Убрать «'+o.items[i].name+'» из заказа?'))return;
 o.items.splice(i,1);save();orderScreen(type,id);
}
// пожелание к блюду: «без лука», «острое», «упаковать отдельно»
function setNote(type,id,i){
 let o=getOrder(type,id),x=o.items[i];
 let v=prompt('Пожелание к блюду «'+x.name+'»\n(пустое поле — убрать комментарий):',x.note||'');
 if(v===null)return;
 v=v.trim();
 if(v)x.note=v; else delete x.note;
 save();orderScreen(type,id);
}
function total(o){return (o&&o.items||[]).reduce((s,x)=>s+x.price*x.qty,0)}
function setDiscount(type,id){
 let o=getOrder(type,id);
 let v=prompt('Скидка в ¥ (0 — убрать скидку):',o.discount||0);
 if(v===null)return;
 o.discount=Math.max(0,+v||0);save();orderScreen(type,id);
}
// сколько кафе платит курьеру за эту доставку: это расход заведения, гость его не платит
function setCourier(id){
 let o=db.delivery[id];
 let v=prompt('Сколько платим курьеру за эту доставку, ¥ (0 — убрать):',o.courier||0);
 if(v===null)return;
 o.courier=Math.max(0,+v||0);save();orderScreen('delivery',id);
}
function moveTable(from){
 document.getElementById('bar').classList.add('hidden');
 let hall=+db.settings.hall||0,street=+db.settings.street||0;
 let h=`<div class="panel"><h2>Перенести «${tableName(from)}»</h2><p class="small">Выберите, куда пересадить гостей. Занятые места отмечены — заказы объединятся.</p>`;
 let group=(title,a,b,cls)=>{
  let s=`<div class="sect">${title}</div><div class="tables ${cls}">`;
  for(let i=a;i<=b;i++){
   if(i===+from)continue;
   let o=db.open[i];
   s+=`<button class="table ${o?'open':''}" onclick="doMove(${from},${i})"><b>${tableName(i)}</b><div class="small">${o?'занят · '+money(total(o)):'свободен'}</div></button>`;
  }
  return s+'</div>';
 };
 if(hall)h+=group('🏠 Зал',1,hall,'');
 if(street)h+=group('☀️ Улица',hall+1,hall+street,'street');
 h+=`<br><button onclick="orderScreen('table','${from}')">← Отмена</button></div>`;
 document.getElementById('tables').innerHTML=h;
}
function doMove(from,to){
 if(db.open[to]&&!confirm(tableName(to)+' занят. Объединить оба заказа в один?'))return;
 if(db.open[to]){
  db.open[from].items.forEach(x=>{
   let e=db.open[to].items.find(y=>y.name===x.name&&y.price===x.price);
   e?e.qty+=x.qty:db.open[to].items.push(x);
  });
  db.open[to].discount=(+db.open[to].discount||0)+(+db.open[from].discount||0);
 }else db.open[to]=db.open[from];
 delete db.open[from];save();show('tables');
}
function cancelOrder(type,id){
 if(!confirm('Отменить заказ целиком? Он не попадёт в историю и выручку.'))return;
 if(type==='table')delete db.open[id];else delete db.delivery[id];
 save();show(type==='table'?'tables':'delivery');
}

/* ---------- ОПЛАТА ---------- */
function payScreen(type,id){
 document.getElementById('bar').classList.add('hidden');
 let o=getOrder(type,id);
 if(!o||!o.items.length)return show(type==='table'?'tables':'delivery');
 let sub=total(o),disc=+o.discount||0,fin=Math.max(0,sub-disc);
 let h=`<div class="panel"><h2>Оплата — ${type==='table'?tableName(id):'Доставка'}</h2>`+
  `<div class="sub"><span>Сумма</span><span>${money(sub)}</span></div>`+
  (disc?`<div class="sub"><span>Скидка</span><span>−${money(disc)}</span></div>`:'')+
  `<div class="tot"><b>К оплате: ${money(fin)}</b></div><label>Способ оплаты</label><div class="actions">`;
 PAYS.forEach(p=>h+=`<button class="primary" onclick="closeOrder('${type}','${id}','${p}')">${p}</button>`);
 h+=`</div><br><button onclick="orderScreen('${type}','${id}')">← Назад к заказу</button></div>`;
 document.getElementById(type==='table'?'tables':'delivery').innerHTML=h;
}
function closeOrder(type,id,pay){
 let o=getOrder(type,id);if(!o||!o.items.length)return;
 let sub=total(o),disc=+o.discount||0;
 let rec={num:db.counter++,type,id,label:type==='table'?tableName(id):'Доставка',items:o.items,subtotal:sub,discount:disc,total:Math.max(0,sub-disc),courier:type==='delivery'?(+o.courier||0):0,pay,time:new Date().toISOString()};
 db.orders.push(rec);
 if(type==='table')delete db.open[id];else delete db.delivery[id];
 save();
 // принтера в кафе пока нет: печать по умолчанию выключена, включается в «⚙️ Данные».
 // Ненапечатанный чек не теряется — его можно распечатать из истории заказов.
 if(db.settings.printReceipt)printReceipt(rec,false);
 show(type==='table'?'tables':'delivery');
}

/* ---------- ПЕЧАТЬ ---------- */
function printBill(type,id){
 let o=getOrder(type,id);
 if(!o||!o.items.length)return show(type==='table'?'tables':'delivery');
 let sub=total(o),disc=+o.discount||0;
 printReceipt({num:'—',type,id,label:type==='table'?tableName(id):'Доставка',items:o.items,subtotal:sub,discount:disc,total:Math.max(0,sub-disc),pay:'',time:new Date().toISOString()},true);
}
function printReceipt(r,isBill){
 let d=new Date(r.time);
 let h=`<div class="c big">Центр плова</div>`+
  `<div class="c">${isBill?'ПРЕДВАРИТЕЛЬНЫЙ СЧЁТ':'ЧЕК № '+r.num}</div><hr>`+
  `<div class="r"><span>${esc(orderName(r))}</span><span>${d.toLocaleDateString('ru-RU')} ${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span></div><hr>`;
 r.items.forEach(x=>{
  h+=`<div>${esc(x.name)}</div>`;
  if(x.note)h+=`<div>  * ${esc(x.note)}</div>`;
  h+=`<div class="r"><span>${money(x.price)} × ${qtyText(x.qty)}</span><span>${money(x.price*x.qty)}</span></div>`;
 });
 h+='<hr>';
 if(r.discount){
  h+=`<div class="r"><span>Сумма</span><span>${money(r.subtotal)}</span></div>`+
     `<div class="r"><span>Скидка</span><span>-${money(r.discount)}</span></div>`;
 }
 h+=`<div class="r big"><span>ИТОГО</span><span>${money(r.total)}</span></div>`;
 if(r.pay)h+=`<div class="r"><span>Оплата</span><span>${esc(r.pay)}</span></div>`;
 h+=`<hr><div class="c">${esc(db.settings.footer||'')}</div>`;
 document.getElementById('receipt').innerHTML=h;
 window.print();
}

/* ---------- ИСТОРИЯ ---------- */
// к какому виду относится заказ: сохранённое имя надёжнее настроек, они могли поменяться
function orderKind(o){
 if(o.type==='delivery')return'deliv';
 return String(o.label||orderName(o)).startsWith('Улица')?'street':'hall';
}
const KINDS={hall:{t:'🏠 Зал',c:'b-hall'},street:{t:'☀️ Улица',c:'b-street'},deliv:{t:'🚚 Доставка',c:'b-deliv'}};
function setHistFilter(f){histFilter=f;renderHistory()}
function renderHistory(){
 hideBar();
 let f=histFilter;
 let all=db.orders.map((o,i)=>({o,i,k:orderKind(o)}));
 let cnt={all:all.length,hall:0,street:0,deliv:0};
 all.forEach(x=>cnt[x.k]++);
 // сортируем по времени, а не по порядку в базе — после импорта бэкапа он может не совпадать
 let list=(f==='all'?all:all.filter(x=>x.k===f)).sort((a,b)=>new Date(b.o.time)-new Date(a.o.time));

 let tabs=[['all','Все'],['hall','🏠 Зал'],['street','☀️ Улица'],['deliv','🚚 Доставка']];
 let h='<div class="panel"><h2>История заказов</h2><div class="cats">'+
  tabs.map(([k,t])=>`<button class="${f===k?'on':''}" onclick="setHistFilter('${k}')">${t} <span class="small">${cnt[k]}</span></button>`).join('')+
  '</div>';

 if(!db.orders.length){
  h+='<p class="muted">История пока пустая.</p></div>';
  document.getElementById('history').innerHTML=h;return;
 }
 if(!list.length)h+='<p class="muted">В этой категории заказов пока нет.</p>';

 let sum=list.filter(x=>!x.o.void).reduce((s,x)=>s+x.o.total,0);
 if(list.length)h+=`<div class="row"><span class="muted">Показано заказов: <b>${list.length}</b></span><b class="price">${money(sum)}</b></div>`;

 let shown=list.slice(0,200),day='';
 shown.forEach(({o,i,k})=>{
  let d=new Date(o.time),ds=d.toDateString();
  if(ds!==day){
   day=ds;
   let dayList=list.filter(x=>new Date(x.o.time).toDateString()===ds);
   let dsum=dayList.filter(x=>!x.o.void).reduce((s,x)=>s+x.o.total,0);
   let today=ds===new Date().toDateString();
   h+=`<div class="sect">${today?'Сегодня':d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})} <span class="small">${dayList.length} зак. · ${money(dsum)}</span></div>`;
  }
  let title=k==='deliv'?'Заказ №'+(o.num||'—'):esc(orderName(o))+' <span class="small">№'+(o.num||'—')+'</span>';
  h+=`<div class="row" ${o.void?'style="opacity:.55"':''}><span><span class="badge ${KINDS[k].c}">${KINDS[k].t}</span> <b>${title}</b>${o.void?' <span class="badge b-void">✕ аннулирован</span>':''}<br><span class="small">${d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})} · ${o.items.length} поз. · ${esc(o.pay||'—')}${(+o.courier)?' · 🚴 −'+money(o.courier):''}</span></span><b style="${o.void?'text-decoration:line-through;color:#9ca3af':''}">${money(o.total)}</b><span class="actions"><button onclick="openHistOrder(${i})">Что заказали</button><button onclick="reprint(${i})">🖨</button></span></div>`;
 });
 if(list.length>200)h+='<p class="small muted">Показаны последние 200 заказов из '+list.length+'. Полный список — «⚙️ Данные» → выгрузка в CSV.</p>';
 h+='</div>';
 document.getElementById('history').innerHTML=h;
}
// Куда вернуть список после просмотра чека. Пишется только при входе из списка:
// перерисовки внутри самого чека (аннулирование) позицию затирать не должны.
let histScroll=0;
function openHistOrder(i){
 histScroll=window.scrollY||document.documentElement.scrollTop||0;
 histDetails(i);
 window.scrollTo(0,0);
}
function backHistory(){
 show('history');
 window.scrollTo(0,histScroll);
 // список строится синхронно, но высота может доехать на следующий кадр
 requestAnimationFrame(()=>window.scrollTo(0,histScroll));
}
function histDetails(i){
 let o=db.orders[i],d=new Date(o.time);
 let h=`<div class="panel"><h2>Чек №${o.num||'—'} <span class="small">${esc(orderName(o))} · ${d.toLocaleString('ru-RU')}</span></h2>`;
 if(o.void)h+=`<div class="warn" style="background:#fee2e2;border-color:#dc2626">✕ <b>Чек аннулирован</b> ${new Date(o.void.at).toLocaleString('ru-RU')}${o.void.reason?' · '+esc(o.void.reason):''}. В выручку не входит.</div>`;
 o.items.forEach(x=>h+=`<div class="row"><span>${esc(x.name)}<br><span class="small">${money(x.price)} × ${qtyText(x.qty)}</span>${x.note?`<br><span class="note">💬 ${esc(x.note)}</span>`:''}</span><b>${money(x.price*x.qty)}</b></div>`);
 if(o.discount)h+=`<div class="sub"><span>Сумма</span><span>${money(o.subtotal)}</span></div><div class="sub"><span>Скидка</span><span>−${money(o.discount)}</span></div>`;
 h+=`<div class="tot"><b>Итого: ${money(o.total)}</b> <span class="small">${esc(o.pay||'—')}</span></div>`;
 if(+o.courier)h+=`<div class="sub"><span>🚴 Курьеру</span><span>−${money(o.courier)}</span></div>`;
 let cost=orderCost(o);
 if(cost)h+=`<div class="sub"><span>Себестоимость</span><span>−${money(cost)}</span></div><div class="sub"><span><b>Прибыль с заказа</b></span><span><b>${money(o.total-cost-(+o.courier||0))}</b></span></div>`;
 h+=`<div class="actions"><button onclick="backHistory()">← Назад</button><button class="blue" onclick="reprint(${i})">🖨 Перепечатать</button>`;

// аннулирование: чек остаётся в истории с пометкой, но из выручки уходит
function voidOrder(i){
 let o=db.orders[i];
 if(o.void)return;
 let r=prompt('Причина аннулирования (ошибка кассира, отказ гостя и т.п.):','');
 if(r===null)return;
 if(!confirm('Аннулировать чек №'+(o.num||'')+' на '+money(o.total)+'?\n\nОн останется в истории с пометкой, но перестанет считаться в выручке.'))return;
 o.void={at:new Date().toISOString(),reason:r.trim()};
 save();histDetails(i);
}
// вернуть заказ в работу: позиции снова открыты, а старый чек аннулируется
function restoreOrder(i){
 let o=db.orders[i];
 if(o.void)return;
 if(o.type==='table'){
  if(db.open[o.id])return alert(orderName(o)+' сейчас занят другим заказом. Сначала закройте или перенесите его.');
  db.open[o.id]={items:JSON.parse(JSON.stringify(o.items)),discount:+o.discount||0,started:new Date().toISOString()};
 }else{
  let nid='D'+Date.now();
  db.delivery[nid]={items:JSON.parse(JSON.stringify(o.items)),discount:+o.discount||0,courier:+o.courier||0,started:new Date().toISOString()};
 }
 o.void={at:new Date().toISOString(),reason:'возврат в работу'};
 save();
 alert('Заказ снова открыт. Чек №'+(o.num||'')+' аннулирован.');
 show(o.type==='table'?'tables':'delivery');
}
// себестоимость заказа — по ценам, зафиксированным в момент продажи
function orderCost(o){return (o.items||[]).reduce((s,x)=>s+(+x.cost||0)*x.qty,0)}
// всё, что реально считается выручкой: без аннулированных
function liveOrders(){return db.orders.filter(o=>!o.void)}
function reprint(i){printReceipt(db.orders[i],false)}

/* ---------- КАССА: ПРИХОД И РАСХОД ---------- */
const OUT_CATS=['Продукты','Зарплата','Аренда','Свет','Вода','Газ','Отопление','Интернет','Телефон',
 'Хозтовары','Упаковка','Такси/доставка','Ремонт','Оборудование','Реклама','Налоги','Вывоз мусора','Инкассация','Прочее'];
const IN_CATS=['Внесение в кассу','Возврат от поставщика','Прочее'];
const WASTE_REASONS=['Испортилось','Не продали','Брак при готовке','Угостили гостя','Уронили/разбили','Ошибка заказа'];

function cashOps(from){from=from||shiftFrom();return (db.cash||[]).filter(o=>new Date(o.time)>=from)}
// сколько денег должно быть по каждому способу оплаты: продажи + внесения − расходы − выданное курьерам
function balances(from){
 from=from||shiftFrom();
 let ops=cashOps(from), sales=liveOrders().filter(o=>new Date(o.time)>=from), r={};
 allPays().forEach(pm=>{
  let sale=sales.filter(o=>o.pay===pm).reduce((a,o)=>a+o.total,0);
  let inn=ops.filter(o=>o.dir==='in'&&o.pay===pm).reduce((a,o)=>a+o.sum,0);
  let out=ops.filter(o=>o.dir==='out'&&o.pay===pm).reduce((a,o)=>a+o.sum,0);
  let cour=pm==='Наличные'?sales.reduce((a,o)=>a+(+o.courier||0),0):0;
  r[pm]={sale,inn,out,cour,bal:sale+inn-out-cour};
 });
 return r;
}
function opex(from){return cashOps(from).filter(o=>o.dir==='out'&&o.cat!=='Инкассация').reduce((a,o)=>a+o.sum,0)}
// списание блюд: убыток считаем по себестоимости, а не по цене продажи
function wasteOps(from){from=from||shiftFrom();return (db.waste||[]).filter(o=>new Date(o.time)>=from)}
function wasteCost(from){return wasteOps(from).reduce((a,o)=>a+(+o.cost||0)*o.qty,0)}
function addWaste(){
 let mi=document.getElementById('wm').value;
 let q=+document.getElementById('wq').value;
 if(mi==='')return alert('Выберите блюдо.');
 if(!(q>0))return alert('Укажите количество больше нуля.');
 let m=db.menu[+mi];
 db.waste.push({name:m.n,qty:q,cost:+m.k||0,price:+m.p||0,
  reason:document.getElementById('wr').value,time:new Date().toISOString()});
 save();renderCash();
}
function delWaste(i){
 let o=db.waste[i];
 if(!o||!confirm('Убрать списание «'+o.name+' × '+o.qty+'»?'))return;
 db.waste.splice(i,1);save();renderCash();
}
let cashTab='ops', cashMonth=null, cashYear=null, sumPeriod='day', sumDay=null;
// раскрыт ли список проданных блюд под карточкой «Выручка»
let dishesOpen=false;
function toggleDishes(){dishesOpen=!dishesOpen;renderCash()}
function setCashTab(t){cashTab=t;renderCash()}
function ym(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function ymLabel(k){
 let a=k.split('-');
 return ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'][+a[1]-1]+' '+a[0];
}
// ежемесячные платежи вносятся сами, один раз в месяц
function applyFixed(){
 let now=new Date(), key=ym(now), added=0;
 (db.fixed||[]).forEach(f=>{
  if(!(+f.s>0))return;                 // сумма ещё не указана — вносить нечего
  let k=key+'|'+f.n;
  if((db.cash||[]).some(o=>o.fkey===k))return;
  if((db.fixedSkip||[]).indexOf(k)>=0)return;
  let d=new Date(now.getFullYear(),now.getMonth(),1,9,0,0);
  db.cash.push({dir:'out',cat:f.n,sum:+f.s||0,pay:f.pay||'Наличные',
   note:'ежемесячный платёж',time:d.toISOString(),fkey:k});
  added++;
 });
 if(added)save();
 return added;
}

 let w=wasteOps(from), wc=wasteCost(from);

 if(!ops.length)h+='<p class="muted">Операций пока нет.</p>';
 [...ops].reverse().forEach(o=>h+=opRow(o));

function opRow(o){
 let i=db.cash.indexOf(o);
 return `<div class="row"><span><span class="badge ${o.dir==='in'?'b-hall':'b-void'}">${o.dir==='in'?'+ приход':'− расход'}</span> <b>${esc(o.cat)}</b>${o.fkey?' <span class="badge b-street">🔁 ежемесячный</span>':''}<br><span class="small">${new Date(o.time).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${esc(o.pay)}${o.note?' · '+esc(o.note):''}</span></span>`+
  `<b style="color:${o.dir==='in'?'#15803d':'#dc2626'}">${o.dir==='in'?'+':'−'}${money(o.sum)}</b>`+
  `<span class="actions"><button onclick="editCashOp(${i})">✏️</button><button class="danger" onclick="delCashOp(${i})">✕</button></span></div>`;
}
function addCashOp(dir){
 let cat=document.getElementById('cc').value.trim();
 let sum=+document.getElementById('cs').value;
 if(!cat)return alert('Напишите, что купили или за что платим.');
 if(!(sum>0))return alert('Укажите сумму больше нуля.');
 db.cash.push({dir:dir,cat:cat,sum:sum,pay:document.getElementById('cp').value,
  note:document.getElementById('cn').value.trim(),time:new Date().toISOString()});
 save();renderCash();
}
function editCashOp(i){
 let o=db.cash[i];if(!o)return;
 let c=prompt('Что купили / за что платим:',o.cat);if(c===null)return;
 let sv=prompt('Сумма ¥:',o.sum);if(sv===null)return;
 if(!(+sv>0))return alert('Сумма должна быть больше нуля.');
 o.cat=c.trim()||o.cat;o.sum=+sv;
 save();renderCash();
}
function delCashOp(i){
 let o=db.cash[i];
 if(!o||!confirm('Удалить операцию «'+o.cat+'» на '+money(o.sum)+'?'))return;
 if(o.fkey){db.fixedSkip=db.fixedSkip||[];db.fixedSkip.push(o.fkey)}
 db.cash.splice(i,1);save();renderCash();
}

/* --- вкладка: итоги за месяц и год --- */
// архив: каждый день, по которому есть данные, с итогом — история хранится вечно
function allDays(){
 let keys=[...new Set([...(db.cash||[]).map(o=>dayKey(o.time)),
  ...liveOrders().map(o=>dayKey(o.time)),...(db.waste||[]).map(o=>dayKey(o.time))])].sort().reverse();
 return keys.map(k=>{
  let sales=liveOrders().filter(o=>dayKey(o.time)===k);
  let ops=(db.cash||[]).filter(o=>dayKey(o.time)===k);
  let waste=(db.waste||[]).filter(o=>dayKey(o.time)===k);
  let rev=sales.reduce((a,o)=>a+o.total,0);
  let cost=sales.reduce((a,o)=>a+orderCost(o),0);
  let cour=sales.reduce((a,o)=>a+(+o.courier||0),0);
  let out=ops.filter(o=>o.dir==='out'&&o.cat!=='Инкассация').reduce((a,o)=>a+o.sum,0);
  let wc=waste.reduce((a,o)=>a+(+o.cost||0)*o.qty,0);
  return {k,rev,exp:out,orders:sales.length,net:rev-cost-cour-out-wc};
 });
}
function dayLabel(k){
 let today=dayKey(new Date()), yest=dayKey(new Date(Date.now()-864e5));
 if(k===today)return 'Сегодня';
 if(k===yest)return 'Вчера';
 return new Date(k).toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
}
function openDay(k){sumPeriod='day';sumDay=k;cashTab='sum';renderCash();window.scrollTo(0,0)}
function dayArchive(limit){
 let days=allDays();
 if(!days.length)return '<div class="panel"><p class="muted">Пока нет ни одного дня с данными.</p></div>';
 let h='<div class="panel">';
 days.slice(0,limit||60).forEach(d=>{
  h+=`<div class="row" style="cursor:pointer" onclick="openDay('${d.k}')"><span><b>${dayLabel(d.k)}</b><br><span class="small">${d.orders} зак. · выручка ${money(d.rev)}${d.exp?' · расходы '+money(d.exp):''}</span></span><b style="color:${d.net<0?'#dc2626':'#15803d'}">${money(d.net)}</b><button onclick="event.stopPropagation();openDay('${d.k}')">Открыть</button></div>`;
 });
 if(days.length>(limit||60))h+=`<p class="small muted">Показаны последние ${limit||60} дней из ${days.length}.</p>`;
 return h+'</div>';
}
function viewCashSum(){
 let tabs=[['day','За день'],['month','За месяц'],['year','За год']];
 let h='<div class="panel"><div class="cats" style="margin:0">'+
  tabs.map(t=>`<button class="${sumPeriod===t[0]?'on':''}" onclick="sumPeriod='${t[0]}';renderCash()">${t[1]}</button>`).join('')+
  '</div></div>';
 return h+({day:viewSumDay,month:viewSumMonth,year:viewSumYear})[sumPeriod]();
}
function dayKey(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
// что продано за период: раскрывается нажатием на карточку «Выручка»
function dishList(sales,title){
 let map={};
 sales.forEach(o=>(o.items||[]).forEach(x=>{
  let r=map[x.name]=map[x.name]||{q:0,sum:0,cost:0};
  r.q+=x.qty; r.sum+=x.price*x.qty; r.cost+=(+x.cost||0)*x.qty;
 }));
 let rows=Object.entries(map).sort((a,b)=>b[1].sum-a[1].sum);
 if(!rows.length)return '<div class="panel"><p class="muted">В заказах нет ни одной позиции.</p></div>';
 let totQ=rows.reduce((a,e)=>a+e[1].q,0), totS=rows.reduce((a,e)=>a+e[1].sum,0);
 let rev=sales.reduce((a,o)=>a+o.total,0);
 let h=`<div class="sect">🍽️ Что продано ${title} <span class="small">${rows.length} наим. · ${qtyText(totQ)} порций</span></div><div class="panel">`;
 rows.forEach(e=>{
  let n=e[0], r=e[1];
  h+=`<div class="row"><span>${esc(n)}<br><span class="small">${qtyText(r.q)} порц. по ${money(r.sum/r.q)}${r.cost?' · прибыль '+money(r.sum-r.cost):''}</span></span><b>${money(r.sum)}</b></div>`;
 });
 h+=`<div class="row"><span><b>Всего блюд</b></span><b>${money(totS)}</b></div>`;
 // сумма блюд считается до скидок, выручка — после, поэтому они могут не сойтись
 if(Math.abs(totS-rev)>0.005)h+=`<p class="small muted">Блюд продано на ${money(totS)}, выручка ${money(rev)} — разница ${money(totS-rev)} это скидки.</p>`;
 return h+'</div>';
}
// сводка по любому набору продаж и операций — общая часть для дня и месяца
function periodBlocks(sales,ops,waste,title){
 let rev=sales.reduce((a,o)=>a+o.total,0);
 let cost=sales.reduce((a,o)=>a+orderCost(o),0);
 let cour=sales.reduce((a,o)=>a+(+o.courier||0),0);
 let out=ops.filter(o=>o.dir==='out'), inn=ops.filter(o=>o.dir==='in');
 let outSum=out.reduce((a,o)=>a+o.sum,0), inSum=inn.reduce((a,o)=>a+o.sum,0);
 let realOut=out.filter(o=>o.cat!=='Инкассация').reduce((a,o)=>a+o.sum,0);
 let wc=waste.reduce((a,o)=>a+(+o.cost||0)*o.qty,0);
 let net=rev-cost-cour-realOut-wc;
 let gross=rev-cost-cour;                       // заработок на самих блюдах, до расходов кафе
 let noCost=sales.some(o=>(o.items||[]).some(x=>!(+x.cost)));
 let h='<div class="grid">'+
  `<div class="card${sales.length?' tap':''}"${sales.length?' onclick="toggleDishes()"':''}><span class="muted">Выручка</span><div class="stat">${money(rev)}</div><small>${sales.length} заказов${sales.length?' · <b style="color:#2563eb">'+(dishesOpen?'скрыть блюда ▲':'что продано ▼')+'</b>':''}</small></div>`+
  (sales.length?`<div class="card"><span class="muted">Прибыль с блюд</span><div class="stat" style="color:#15803d">${money(gross)}</div><small>${noCost?'⚠️ себестоимость не у всех':(rev?Math.round(gross/rev*100)+'% от выручки':'')}</small></div>`:'')+
  `<div class="card"><span class="muted">Расходы</span><div class="stat" style="color:#dc2626">−${money(outSum)}</div><small>${out.length} операций</small></div>`+
  (inSum?`<div class="card"><span class="muted">Приходы</span><div class="stat" style="color:#15803d">+${money(inSum)}</div></div>`:'')+
  `<div class="card"><span class="muted">Чистая прибыль</span><div class="stat" style="color:${net<0?'#dc2626':'#15803d'}">${money(net)}</div><small>после всех расходов</small></div></div>`;
 if(dishesOpen&&sales.length)h+=dishList(sales,title);
 // расшифровка
 if(rev||outSum||wc){
  h+='<div class="panel"><h3>Из чего сложилось</h3>'+
   `<div class="row"><span>Выручка</span><b>${money(rev)}</b></div>`+
   (cost?`<div class="row"><span>Себестоимость блюд</span><b style="color:#dc2626">−${money(cost)}</b></div>`:'')+
   (cour?`<div class="row"><span>🚴 Курьерам</span><b style="color:#dc2626">−${money(cour)}</b></div>`:'')+
   (sales.length?`<div class="row"><span><b>Прибыль с блюд</b></span><b style="color:#15803d">${money(gross)}</b></div>`:'')+
   (realOut?`<div class="row"><span>Расходы и покупки</span><b style="color:#dc2626">−${money(realOut)}</b></div>`:'')+
   (wc?`<div class="row"><span>🗑 Списано блюд</span><b style="color:#dc2626">−${money(wc)}</b></div>`:'')+
   `<div class="row"><span><b>Чистая прибыль</b></span><b style="color:${net<0?'#dc2626':'#15803d'}">${money(net)}</b></div>`;
  if(outSum!==realOut)h+='<p class="small muted">Инкассация в расходы не входит — это перемещение денег, а не трата.</p>';
  if(noCost&&sales.length)h+='<p class="small" style="color:#92400e">⚠️ У части проданных блюд не указана себестоимость — прибыль с блюд завышена. Заполните её в разделе «🍽️ Меню».</p>';
  h+='</div>';
 }
 // выручка по способам оплаты
 if(sales.length){
  h+='<div class="panel"><h3>Выручка по оплате</h3>';
  allPays().forEach(pm=>{
   let v=sales.filter(o=>o.pay===pm).reduce((a,o)=>a+o.total,0);
   if(v)h+=`<div class="row"><span>${pm}</span><b>${money(v)}</b><span class="small">${rev?Math.round(v/rev*100):0}%</span></div>`;
  });
  h+='</div>';
 }
 // на что потрачено
 let byCat={};
 out.forEach(o=>byCat[o.cat]=(byCat[o.cat]||0)+o.sum);
 h+=`<div class="sect">На что потрачено ${title}</div><div class="panel">`;
 if(!out.length)h+='<p class="muted">Расходов не было.</p>';
 Object.entries(byCat).sort((a,b)=>b[1]-a[1]).forEach(e=>
  h+=`<div class="row"><span>${esc(e[0])}</span><b style="color:#dc2626">−${money(e[1])}</b><span class="small">${outSum?Math.round(e[1]/outSum*100):0}%</span></div>`);
 if(out.length)h+=`<div class="row"><span><b>Всего</b></span><b>−${money(outSum)}</b></div>`;
 h+='</div>';
 // что и когда куплено
 h+='<div class="sect">Что и когда куплено</div><div class="panel">';
 if(!ops.length)h+='<p class="muted">Операций нет.</p>';
 [...ops].sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,200).forEach(o=>h+=opRow(o));
 h+='</div>';
 // списания
 if(waste.length){
  let byN={};
  waste.forEach(o=>{byN[o.name]=byN[o.name]||{q:0,s:0};byN[o.name].q+=o.qty;byN[o.name].s+=(+o.cost||0)*o.qty});
  h+='<div class="sect">🗑 Списано</div><div class="panel">';
  Object.entries(byN).sort((a,b)=>b[1].s-a[1].s).forEach(e=>
   h+=`<div class="row"><span>${esc(e[0])} <span class="small">× ${qtyText(e[1].q)}</span></span><b style="color:#dc2626">−${money(e[1].s)}</b></div>`);
  h+=`<div class="row"><span><b>Всего</b></span><b style="color:#dc2626">−${money(wc)}</b></div></div>`;
 }
 return h;
}
/* --- итоги за день --- */
function viewSumDay(){
 if(!sumDay)sumDay=dayKey(new Date());
 let today=dayKey(new Date());
 let yest=dayKey(new Date(Date.now()-864e5));
 let label=sumDay===today?'сегодня':sumDay===yest?'вчера':new Date(sumDay).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
 let h='<div class="panel"><label>Дата</label><input type="date" value="'+sumDay+'" max="'+today+'" onchange="sumDay=this.value;renderCash()">'+
  '<div class="actions"><button class="'+(sumDay===today?'dark':'')+'" onclick="sumDay=\''+today+'\';renderCash()">Сегодня</button>'+
  '<button class="'+(sumDay===yest?'dark':'')+'" onclick="sumDay=\''+yest+'\';renderCash()">Вчера</button></div></div>';
 let sales=liveOrders().filter(o=>dayKey(o.time)===sumDay);
 let ops=(db.cash||[]).filter(o=>dayKey(o.time)===sumDay);
 let waste=(db.waste||[]).filter(o=>dayKey(o.time)===sumDay);
 h+=`<div class="sect first">Итоги за ${label}</div>`;
 h+=periodBlocks(sales,ops,waste,'за '+label);
 h+='<div class="sect">📆 История по дням <span class="small">нажмите на день, чтобы открыть его итоги</span></div>';
 h+=dayArchive(60);
 return h;
}
/* --- итоги за месяц --- */
function viewSumMonth(){
 let months=[...new Set([...(db.cash||[]).map(o=>ym(o.time)),...liveOrders().map(o=>ym(o.time))])].sort().reverse();
 let cur=ym(new Date());
 if(months.indexOf(cur)<0)months.unshift(cur);
 if(!cashMonth||months.indexOf(cashMonth)<0)cashMonth=cur;
 let h='<div class="panel"><label>Месяц</label><select onchange="cashMonth=this.value;renderCash()">'+
  months.map(m=>`<option value="${m}" ${m===cashMonth?'selected':''}>${ymLabel(m)}</option>`).join('')+'</select></div>';
 let sales=liveOrders().filter(o=>ym(o.time)===cashMonth);
 let ops=(db.cash||[]).filter(o=>ym(o.time)===cashMonth);
 let waste=(db.waste||[]).filter(o=>ym(o.time)===cashMonth);
 h+=`<div class="sect first">Итоги за ${ymLabel(cashMonth)}</div>`;
 h+=periodBlocks(sales,ops,waste,'— '+ymLabel(cashMonth));
 // по дням месяца
 let byD={};
 sales.forEach(o=>{let k=dayKey(o.time);byD[k]=byD[k]||{r:0,e:0};byD[k].r+=o.total});
 ops.filter(o=>o.dir==='out').forEach(o=>{let k=dayKey(o.time);byD[k]=byD[k]||{r:0,e:0};byD[k].e+=o.sum});
 let days=Object.keys(byD).sort().reverse();
 if(days.length){
  h+='<div class="panel"><h3>По дням</h3>';
  days.forEach(k=>h+=`<div class="row" style="cursor:pointer" onclick="openDay('${k}')"><span>${new Date(k).toLocaleDateString('ru-RU',{day:'numeric',month:'short',weekday:'short'})}</span><b>${money(byD[k].r)}</b>${byD[k].e?`<b style="color:#dc2626">−${money(byD[k].e)}</b>`:'<span class="small">—</span>'}<button onclick="event.stopPropagation();openDay('${k}')">Открыть</button></div>`);
  h+='</div>';
 }
 return h;
}

/* --- вкладка: постоянные ежемесячные платежи --- */
function viewCashFix(){
 let cur=ym(new Date());
 let tot=(db.fixed||[]).reduce((a,f)=>a+(+f.s||0),0);
 let empty=(db.fixed||[]).filter(f=>!(+f.s>0)).length;
 let h='';
 if(empty)h+=`<div class="warn">⚠️ У <b>${empty}</b> платежей не указана сумма — они не попадают в расходы. Нажмите ✏️ и впишите, сколько платите в месяц.</div>`;
 h+='<div class="panel"><h2>🔁 Ежемесячные платежи</h2>'+
  '<p class="small">Вносятся автоматически первого числа каждого месяца и попадают в расходы. Сумму можно поправить — например, если свет вышел дороже.</p>';

let dishPeriod='day';
function dishRows(period){

 if(period==='day'){from=new Date();from.setHours(0,0,0,0)}
 else if(period==='week'){from=new Date(Date.now()-7*864e5)}
 else if(period==='month'){from=new Date(now.getFullYear(),now.getMonth(),1)}
 else from=new Date(0);
 let sales=liveOrders().filter(o=>new Date(o.time)>=from);
 let map={};
 sales.forEach(o=>(o.items||[]).forEach(x=>{
  let r=map[x.name]=map[x.name]||{n:x.name,q:0,sum:0,cost:0};
  r.q+=x.qty; r.sum+=x.price*x.qty; r.cost+=(+x.cost||0)*x.qty;
 }));
 let rows=Object.values(map).sort((a,b)=>b.sum-a.sum);
 return {rows,sales,from};
}

// себестоимость пишется в чек в момент продажи; если её внесли в меню позже,
// старые чеки остаются с нулём — эта функция проставляет её задним числом
function costMap(){let m={};db.menu.forEach(x=>{if(+x.k)m[x.n]=+x.k});return m}
function missingCost(){
 let m=costMap(), can=0, no=0;
 let scan=items=>(items||[]).forEach(x=>{if(+x.cost)return;m[x.name]?can++:no++});
 db.orders.forEach(o=>scan(o.items));
 Object.values(db.open).forEach(o=>scan(o.items));
 Object.values(db.delivery).forEach(o=>scan(o.items));
 (db.waste||[]).forEach(w=>{if(+w.cost)return;m[w.name]?can++:no++});
 return {can,no};
}
function recalcCosts(){
 let m=costMap(), fixed=0;
 let fix=items=>(items||[]).forEach(x=>{if(!(+x.cost)&&m[x.name]){x.cost=m[x.name];fixed++}});
 db.orders.forEach(o=>fix(o.items));
 Object.values(db.open).forEach(o=>fix(o.items));
 Object.values(db.delivery).forEach(o=>fix(o.items));
 (db.waste||[]).forEach(w=>{if(!(+w.cost)&&m[w.name]){w.cost=m[w.name];fixed++}});
 save();
 let left=missingCost().no;
 alert('Готово. Себестоимость проставлена в '+fixed+' позициях.'+
  (left?'\n\nОсталось без себестоимости: '+left+'. У этих блюд она не заполнена в меню.':''));
 renderMenu();
}

 h+='<div class="panel"><h2>Управление меню</h2>'+
  '<label>Название блюда</label><input id="mn" placeholder="Например: Плов">'+

  '<label>Себестоимость ¥ <span class="small">во сколько блюдо обходится кафе</span></label><input id="mk" type="number" inputmode="decimal" placeholder="0">'+
  '<label>Категория</label><input id="mc" list="catlist" placeholder="Основные">'+
  '<datalist id="catlist">'+cats.map(c=>`<option value="${esc(c)}">`).join('')+'</datalist>'+

 cats.forEach(c=>{
  h+=`<h3>${esc(c)}</h3>`;
  db.menu.forEach((m,i)=>{
   if((m.c||'Прочее')!==c)return;

   let ph=dishPhoto(m);
   h+=`<div class="mrow">`+
      (ph?`<img class="mph" src="${ph}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;noph&quot;>🍽️</div>'">`:'<div class="noph">🍽️</div>')+

      `<span class="actions"><button onclick="pickPhoto(${i})">📷</button>`+
      (m.img?`<button onclick="dropPhoto(${i})">✕ фото</button>`:'')+
      `<button onclick="editMenu(${i})">✏️</button><button class="danger" onclick="delMenu(${i})">Удалить</button></span></div>`;
  });
 });
 h+='</div>';

// фото с телефона: уменьшаем и режем в квадрат, иначе память браузера кончится за десяток снимков
function pickPhoto(i){
 let inp=document.createElement('input');
 inp.type='file';inp.accept='image/*';
 inp.onchange=function(){
  let f=inp.files&&inp.files[0];if(!f)return;
  let fr=new FileReader();
  fr.onload=function(){
   let im=new Image();
   im.onload=function(){
    let S=320,side=Math.min(im.width,im.height);
    let c=document.createElement('canvas');c.width=S;c.height=S;
    c.getContext('2d').drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,S,S);
    let data=c.toDataURL('image/jpeg',0.72);
    let before=db.menu[i].img||'';
    db.menu[i].img=data;
    try{localStorage.setItem(KEY,JSON.stringify(db))}
    catch(e){
     db.menu[i].img=before;
     alert('Не хватило места в памяти браузера. Уберите фото у части блюд или сделайте бэкап и очистите историю.');
     return;
    }
    renderMenu();
   };
   im.onerror=function(){alert('Не получилось открыть этот файл как картинку.')};
   im.src=fr.result;
  };
  fr.readAsDataURL(f);
 };
 inp.click();
}
function dropPhoto(i){
 if(!confirm('Убрать фото у «'+db.menu[i].n+'»?'))return;
 db.menu[i].img='';save();renderMenu();
}
function addMenu(){

}
function delMenu(i){

 db.menu.splice(i,1);save();renderMenu();
}

 if(!storageOk)return '<div class="warn" style="background:#fee2e2;border-color:#dc2626">🚫 <b>Данные НЕ сохраняются!</b> Этот браузер не даёт кассе доступ к памяти. Всё, что вы введёте, исчезнет при обновлении страницы.<br>Откройте файл <b>Центр плова - Касса.html</b> напрямую в Chrome (двойной клик по файлу), а не в режиме просмотра или инкогнито.</div>';

 let today=new Date().toDateString();
 let todayCnt=db.orders.filter(o=>new Date(o.time).toDateString()===today).length;
 let savedToday=db.lastBackupAt&&new Date(db.lastBackupAt).toDateString()===today;
 if(todayCnt>=5&&!savedToday)return `<div class="warn">📥 Сегодня принято заказов: <b>${todayCnt}</b>, а копия за сегодня ещё не сохранялась. В конце смены зайдите в «⚙️ Данные» → «Сохранить копию в файл».</div>`;
 if(n<30)return'';
 return `<div class="warn">⚠️ С последнего бэкапа прошло ${n} заказов. Данные хранятся только в этом браузере — если очистить его память, всё пропадёт. <b>Зайдите в «⚙️ Данные» и сохраните копию.</b></div>`;
}

// сброс кэша приложения: данные лежат отдельно и не трогаются
function forceUpdate(){
 if(location.protocol==='file:'){
  alert('Сейчас открыт файл, скачанный на устройство — новые версии сюда не приходят.\n\nОткройте кассу по ссылке:\necochelovechik-cmyk.github.io/cafe-kassa');
  return;
 }
 if(!confirm('Загрузить свежую версию приложения?\n\nЗаказы, меню и настройки останутся на месте.'))return;
 // адрес с меткой времени обходит и кэш браузера, одной очистки кэша приложения мало
 let done=function(){location.replace(location.pathname+'?u='+Date.now())};
 if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistrations){
  navigator.serviceWorker.getRegistrations()
   .then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))})
   .then(function(){return caches.keys()})
   .then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))})
   .then(done).catch(done);
 }else done();
}
const QUOTA=5*1024*1024;            // ориентир: столько localStorage даёт большинство браузеров
                                    // (точный лимит зависит от браузера, увеличить его нельзя)
function dbBytes(){try{return (localStorage.getItem(KEY)||'').length}catch(e){return 0}}
function dbPercent(){return Math.min(100,Math.round(dbBytes()/QUOTA*100))}
let quotaWarned=false;
function checkQuota(){
 if(quotaWarned)return;
 if(dbPercent()<75)return;
 quotaWarned=true;
 alert('⚠️ Память заполнена примерно на '+dbPercent()+'%.\n\nСохраните полный отчёт («⚙️ Данные»), а затем уберите старые заказы кнопкой «Освободить место» — история останется в скачанном файле.');
}
function dbSize(){
 let n=0;try{n=(localStorage.getItem(KEY)||'').length}catch(e){}
 return n>1048576?(n/1048576).toFixed(1)+' МБ':Math.round(n/1024)+' КБ';
}
function photoCount(){return db.menu.filter(m=>dishPhoto(m)).length}
function saveSettings(){
 let nh=Math.max(0,+document.getElementById('sh').value||0);
 let ns=Math.max(0,+document.getElementById('ss').value||0);
 let willLose=Object.keys(db.open).filter(k=>+k>nh+ns);
 if(willLose.length&&!confirm('Внимание: на столах '+willLose.map(k=>tableName(k)).join(', ')+' есть открытые заказы, а при новых настройках таких столов не будет.\n\nОни попадут в раздел «Заказы на убранных столах». Продолжить?'))return;
 db.settings.hall=nh;
 db.settings.street=ns;

 save();alert('Сохранено. Столов всего: '+tables());show('tables');

function stamp(){
 let d=new Date(),p=n=>String(n).padStart(2,'0');
 return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());
}
function download(name,content,mime){
 let b=new Blob([content],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),1000);
}

 db.lastBackup=db.orders.length;db.lastBackupAt=new Date().toISOString();save();
 if(document.getElementById('settings').innerHTML)renderSettings();
}

 ]));
 let csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');

// общая проверка и применение копии — и для файла, и для вставленного текста
function loadBackupText(text){
 let d,t=String(text||'').trim();
 // полный отчёт — это HTML с копией данных внутри, вытаскиваем её
 if(t.indexOf('kassa-backup')>=0){
  let mm=t.match(/id="kassa-backup"[^>]*>([\s\S]*?)<\/script>/);
  if(mm)t=mm[1].replace(/<\\\//g,'</');
 }
 try{d=JSON.parse(t)}catch(e){return alert('Это не похоже на копию кассы: текст повреждён или скопирован не полностью.')}
 if(!d||!Array.isArray(d.orders)||!Array.isArray(d.menu))return alert('Файл прочитался, но это не копия кассы — нет заказов и меню.');
 if(!confirm('Заменить текущие данные на копию?\n\nВ копии: '+d.orders.length+' заказов, '+d.menu.length+' позиций меню.\nСейчас в базе: '+db.orders.length+' заказов.\n\nТекущие данные будут перезаписаны.'))return;
 try{localStorage.setItem(KEY,JSON.stringify(d))}
 catch(e){return alert('Не хватило места в памяти браузера для этой копии.')}
 db=load();save();
 alert('Данные загружены: '+db.orders.length+' заказов, '+db.menu.length+' позиций меню.');
 show('tables');
}
// полный отчёт: и человекочитаемая таблица, и резервная копия в одном файле
function fullReport(){
 let now=new Date();
 let live=liveOrders();
 let rev=live.reduce((a,o)=>a+o.total,0);
 let cost=live.reduce((a,o)=>a+orderCost(o),0);
 let cour=live.reduce((a,o)=>a+(+o.courier||0),0);
 let ops=db.cash||[], waste=db.waste||[];
 let inn=ops.filter(o=>o.dir==='in'), out=ops.filter(o=>o.dir==='out');
 let innSum=inn.reduce((a,o)=>a+o.sum,0), outSum=out.reduce((a,o)=>a+o.sum,0);
 let realOut=out.filter(o=>o.cat!=='Инкассация').reduce((a,o)=>a+o.sum,0);
 let wc=waste.reduce((a,o)=>a+(+o.cost||0)*o.qty,0);
 let net=rev-cost-cour-realOut-wc;
 let voided=db.orders.filter(o=>o.void);

 let dt=t=>new Date(t).toLocaleString('ru-RU');
 let m=v=>Number(v||0).toFixed(2)+' ¥';
 let H=[];
 let page=(id,title,body)=>H.push(`<section id="${id}"><h2>${title}</h2>${body}</section>`);
 let table=(head,rows)=>rows.length
   ? `<table><thead><tr>${head.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`
   : '<p class="muted">Записей нет.</p>';

 // --- титул ---
 H.push(`<section id="top"><h1>Центр плова — полный отчёт</h1>
  <p class="muted">Сформирован ${dt(now)} · версия кассы ${APP_VERSION}</p>
  <div class="cards">
   <div class="c"><span>Выручка за всё время</span><b>${m(rev)}</b><small>${live.length} чеков</small></div>
   <div class="c"><span>Себестоимость</span><b>−${m(cost)}</b></div>
   <div class="c"><span>Курьерам</span><b>−${m(cour)}</b></div>
   <div class="c"><span>Расходы</span><b>−${m(realOut)}</b></div>
   <div class="c"><span>Списано блюд</span><b>−${m(wc)}</b></div>
   <div class="c"><span>Чистая прибыль</span><b class="${net<0?'neg':'pos'}">${m(net)}</b></div>
  </div>
  <p class="muted">Инкассация и внесения в кассу в прибыль не входят — это перемещение денег.
  Аннулированных чеков: ${voided.length}, в выручку они не включены.</p>
  <nav><b>Разделы:</b>
   <a href="#sales">Чеки</a> · <a href="#dishes">Проданные блюда</a> ·
   <a href="#income">Приход</a> · <a href="#expense">Расход</a> ·
   <a href="#waste">Списания</a> · <a href="#shifts">Смены</a> ·
   <a href="#months">По месяцам</a> · <a href="#menu">Меню</a></nav>
  </section>`);

 // --- чеки ---
 let sales=[...db.orders].sort((a,b)=>new Date(b.time)-new Date(a.time)).map(o=>
  `<tr class="${o.void?'void':''}"><td>${o.num||''}</td><td>${dt(o.time)}</td><td>${esc(orderName(o))}</td>
   <td>${(o.items||[]).map(x=>esc(x.name)+' ×'+qtyText(x.qty)+(x.note?' ('+esc(x.note)+')':'')).join('<br>')}</td>
   <td class="r">${m(o.subtotal||o.total)}</td><td class="r">${o.discount?'−'+m(o.discount):''}</td>
   <td class="r"><b>${m(o.total)}</b></td><td>${esc(o.pay||'')}</td>
   <td class="r">${(+o.courier)?'−'+m(o.courier):''}</td>
   <td>${o.void?'аннулирован'+(o.void.reason?': '+esc(o.void.reason):''):''}</td></tr>`);
 page('sales','Чеки — все продажи',
  `<p class="muted">Всего записей: ${db.orders.length}, из них действующих ${live.length}.</p>`+
  table(['№','Дата','Место','Что заказали','Сумма','Скидка','Итого','Оплата','Курьеру','Статус'],sales));

 // --- проданные блюда ---
 let map={};
 live.forEach(o=>(o.items||[]).forEach(x=>{
  let r=map[x.name]=map[x.name]||{q:0,sum:0,cost:0};
  r.q+=x.qty; r.sum+=x.price*x.qty; r.cost+=(+x.cost||0)*x.qty;
 }));
 let dishes=Object.entries(map).sort((a,b)=>b[1].sum-a[1].sum).map(([n,r])=>
  `<tr><td>${esc(n)}</td><td class="r">${qtyText(r.q)}</td><td class="r">${m(r.sum)}</td>
   <td class="r">${r.cost?m(r.cost):'—'}</td><td class="r">${r.cost?m(r.sum-r.cost):'—'}</td>
   <td class="r">${rev?Math.round(r.sum/rev*100):0}%</td></tr>`);
 let totQ=Object.values(map).reduce((a,r)=>a+r.q,0);
 page('dishes','Проданные блюда за всё время',
  table(['Блюдо','Порций','Выручка','Себестоимость','Прибыль','Доля'],dishes)+
  `<p><b>Итого: ${totQ} порций на ${m(rev)}</b></p>`);

 // --- приход ---
 page('income','Приход денег',
  table(['Дата','Статья','Способ','Сумма','Комментарий'],
   [...inn].sort((a,b)=>new Date(b.time)-new Date(a.time)).map(o=>
   `<tr><td>${dt(o.time)}</td><td>${esc(o.cat)}</td><td>${esc(o.pay)}</td>
    <td class="r"><b>+${m(o.sum)}</b></td><td>${esc(o.note||'')}</td></tr>`))+
  `<p><b>Всего приходов: ${m(innSum)}</b></p>`);

 // --- расход ---
 let byCat={};
 out.forEach(o=>byCat[o.cat]=(byCat[o.cat]||0)+o.sum);
 page('expense','Расход денег',
  `<h3>По статьям</h3>`+
  table(['Статья','Сумма','Доля'],Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>
   `<tr><td>${esc(c)}</td><td class="r">−${m(v)}</td><td class="r">${outSum?Math.round(v/outSum*100):0}%</td></tr>`))+
  `<h3>Все операции</h3>`+
  table(['Дата','Статья','Способ','Сумма','Комментарий'],
   [...out].sort((a,b)=>new Date(b.time)-new Date(a.time)).map(o=>
   `<tr><td>${dt(o.time)}</td><td>${esc(o.cat)}${o.fkey?' <span class="tag">ежемесячный</span>':''}</td>
    <td>${esc(o.pay)}</td><td class="r"><b>−${m(o.sum)}</b></td><td>${esc(o.note||'')}</td></tr>`))+
  `<p><b>Всего расходов: ${m(outSum)}</b>, из них в прибыль пошло ${m(realOut)} (без инкассации).</p>`);

 // --- списания ---
 page('waste','Списанные блюда',
  table(['Дата','Блюдо','Порций','Убыток','Причина'],
   [...waste].sort((a,b)=>new Date(b.time)-new Date(a.time)).map(o=>
   `<tr><td>${dt(o.time)}</td><td>${esc(o.name)}</td><td class="r">${qtyText(o.qty)}</td>
    <td class="r">−${m((+o.cost||0)*o.qty)}</td><td>${esc(o.reason||'')}</td></tr>`))+
  `<p><b>Всего списано на ${m(wc)}</b></p>`);

 // --- смены ---
 page('shifts','Закрытые смены',
  table(['№','Открыта','Закрыта','Чеков','Выручка','Себест.','Курьерам','Расходы','Прибыль','В кассе','Факт','Расхождение'],
   [...(db.shifts||[])].reverse().map(r=>{
    let diff=(r.fact===null||r.fact===undefined)?null:r.fact-r.must;
    return `<tr><td>${r.n}</td><td>${dt(r.from)}</td><td>${dt(r.to)}</td><td class="r">${r.count}</td>
     <td class="r">${m(r.sum)}</td><td class="r">${m(r.cost||0)}</td><td class="r">${m(r.courier||0)}</td>
     <td class="r">${m(r.expenses||0)}</td><td class="r"><b>${m(r.profit)}</b></td>
     <td class="r">${m(r.must)}</td><td class="r">${r.fact==null?'—':m(r.fact)}</td>
     <td class="r ${diff&&diff<0?'neg':''}">${diff==null?'—':(diff===0?'сходится':m(diff))}</td></tr>`;
   })));

 // --- по месяцам ---
 let byM={};
 live.forEach(o=>{let k=ym(o.time);byM[k]=byM[k]||{rev:0,cost:0,cour:0,exp:0,waste:0};
  byM[k].rev+=o.total;byM[k].cost+=orderCost(o);byM[k].cour+=(+o.courier||0)});
 out.forEach(o=>{if(o.cat==='Инкассация')return;let k=ym(o.time);byM[k]=byM[k]||{rev:0,cost:0,cour:0,exp:0,waste:0};byM[k].exp+=o.sum});
 waste.forEach(o=>{let k=ym(o.time);byM[k]=byM[k]||{rev:0,cost:0,cour:0,exp:0,waste:0};byM[k].waste+=(+o.cost||0)*o.qty});
 page('months','Итоги по месяцам',
  table(['Месяц','Выручка','Себестоимость','Курьерам','Расходы','Списания','Чистая прибыль'],
   Object.keys(byM).sort().reverse().map(k=>{
    let v=byM[k], n=v.rev-v.cost-v.cour-v.exp-v.waste;
    return `<tr><td>${ymLabel(k)}</td><td class="r">${m(v.rev)}</td><td class="r">${m(v.cost)}</td>
     <td class="r">${m(v.cour)}</td><td class="r">${m(v.exp)}</td><td class="r">${m(v.waste)}</td>
     <td class="r"><b class="${n<0?'neg':'pos'}">${m(n)}</b></td></tr>`;
   })));

 // --- меню ---
 page('menu','Меню на момент выгрузки',
  table(['Блюдо','Категория','Цена','Себестоимость','Прибыль','Наценка'],
   db.menu.map(x=>{
    let k=+x.k||0;
    return `<tr><td>${esc(x.n)}</td><td>${esc(x.c||'')}</td><td class="r">${m(x.p)}</td>
     <td class="r">${k?m(k):'не указана'}</td><td class="r">${k?m(x.p-k):'—'}</td>
     <td class="r">${k&&x.p?Math.round((x.p-k)/x.p*100)+'%':'—'}</td></tr>`;
   }))+
  `<h3>Ежемесячные платежи</h3>`+
  table(['Платёж','Сумма в месяц','Чем платим'],(db.fixed||[]).map(f=>
   `<tr><td>${esc(f.n)}</td><td class="r">${(+f.s>0)?m(f.s):'не указана'}</td><td>${esc(f.pay||'')}</td></tr>`)));

 // копия данных внутри файла — чтобы отчёт можно было загрузить обратно в кассу
 let backup=JSON.stringify(db).replace(/<\//g,'<\\/');

 let html='<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">'+

function importData(input){
 let f=input.files[0];if(!f)return;
 let r=new FileReader();
 r.onload=()=>{loadBackupText(String(r.result||''));input.value=''};
 r.onerror=()=>{alert('Не удалось прочитать файл.');input.value=''};
 r.readAsText(f);
}
// освобождение места: старые чеки уходят из памяти, но остаются в скачанном отчёте
function archiveOld(){
 let v=prompt('Убрать из памяти заказы старше скольких месяцев?\n\nОни останутся в полном отчёте, который вы скачаете следующим шагом.','6');
 if(v===null)return;
 let months=+v;
 if(!(months>0))return alert('Укажите число месяцев больше нуля.');
 let edge=new Date();edge.setMonth(edge.getMonth()-months);
 let oldOrders=db.orders.filter(o=>new Date(o.time)<edge);
 let oldCash=(db.cash||[]).filter(o=>new Date(o.time)<edge);
 let oldWaste=(db.waste||[]).filter(o=>new Date(o.time)<edge);
 let n=oldOrders.length+oldCash.length+oldWaste.length;
 if(!n)return alert('Записей старше '+months+' мес. нет — освобождать нечего.');
 if(!confirm('Будет убрано из памяти:\n· чеков: '+oldOrders.length+'\n· операций кассы: '+oldCash.length+'\n· списаний: '+oldWaste.length+'\n\nСейчас скачается полный отчёт со ВСЕМИ данными. Сохраните его — после этого старые записи из кассы удалятся.'))return;
 fullReport();
 if(!confirm('Отчёт скачан?\n\nНажмите ОК только если файл действительно сохранился — иначе старые записи пропадут безвозвратно.'))return;
 db.orders=db.orders.filter(o=>new Date(o.time)>=edge);
 db.cash=(db.cash||[]).filter(o=>new Date(o.time)>=edge);
 db.waste=(db.waste||[]).filter(o=>new Date(o.time)>=edge);
 quotaWarned=false;
 save();
 alert('Убрано записей: '+n+'. Занято памяти: '+dbSize()+' ('+dbPercent()+'%).');
 renderSettings();
}
function wipe(){
 if(!confirm('Стереть ВСЮ историю заказов? Меню и настройки останутся.'))return;
 if(!confirm('Точно? Это необратимо. Сначала лучше сохранить копию в файл.'))return;
 db.orders=[];db.counter=1;db.lastBackup=0;save();alert('История очищена.');show('reports');
}
